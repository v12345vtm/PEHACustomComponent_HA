relais_commando:
  name: Relais schakelen
  description: Stuur een commando naar één kanaal van een relaismodule.
  fields:
    hub:
      name: Installatie
      description: Naam van de installatie, alleen nodig als er meerdere zijn.
      required: false
      selector:
        text:
    module:
      name: PHC-nummer relais
      description: Het nummer van de relaismodule, zoals in je programmeersoftware.
      required: true
      selector:
        number:
          min: 0
          max: 31
          mode: box
    kanaal:
      name: Kanaal
      required: true
      selector:
        number:
          min: 0
          max: 7
          mode: box
    actie:
      name: Actie
      required: true
      selector:
        select:
          options:
            - aan
            - uit
            - vergrendel_aan
            - vergrendel_uit
            - omschakelen
            - ontgrendel
            - aan_vertraagd
            - uit_vertraagd
            - aan_met_timer
            - uit_met_timer
            - omschakelen_vertraagd
            - omschakelen_met_timer
    tijd:
      name: Tijd (seconden)
      description: Alleen nodig bij vertraagde en timer-acties.
      required: false
      selector:
        number:
          min: 0
          max: 6553
          unit_of_measurement: s
          mode: box

rolluik_beweeg:
  name: Rolluik bewegen
  description: Stuur een rolluikkanaal omhoog, omlaag of stop, eventueel voor een bepaalde tijd.
  fields:
    hub:
      name: Installatie
      required: false
      selector:
        text:
    module:
      name: PHC-nummer rolluik
      required: true
      selector:
        number:
          min: 0
          max: 31
          mode: box
    kanaal:
      name: Kanaal
      required: true
      selector:
        number:
          min: 0
          max: 3
          mode: box
    actie:
      name: Actie
      required: true
      selector:
        select:
          options:
            - omhoog
            - omlaag
            - stop
            - omhoog_stop
            - omlaag_stop
            - flip_omhoog
            - flip_omlaag
    tijd:
      name: Tijd (seconden)
      description: 0 betekent tot stop.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 6553
          unit_of_measurement: s
          mode: box
    prioriteit:
      name: Prioriteit
      description: De rolluikmodule gebruikt standaard 7, zoals in je flow.
      required: false
      default: 7
      selector:
        number:
          min: 0
          max: 255
          mode: box

status_opvragen:
  name: Status opvragen
  description: Vraag de stand op bij één of alle modules. Zonder velden worden alle modules opgevraagd.
  fields:
    hub:
      name: Installatie
      required: false
      selector:
        text:
    module:
      name: PHC-nummer
      required: false
      selector:
        number:
          min: 0
          max: 31
          mode: box
    type:
      name: Type module
      required: false
      selector:
        select:
          options:
            - relais
            - rolluik
            - ingang

stuur_commando:
  name: Ruw commando sturen
  description: Stuur een zelf samengesteld commando naar de STM. Voor experimenten; de stand wordt niet aangepast.
  fields:
    hub:
      name: Installatie
      required: false
      selector:
        text:
    adres:
      name: Adres (hex)
      description: Bijvoorbeeld 40 voor relais 0, of 02 voor ingang 2.
      required: true
      selector:
        text:
    payload:
      name: Payload (hex)
      description: Bijvoorbeeld 02 voor aan (kanaal 0), of 01 voor een statusopvraag.
      required: true
      selector:
        text:

simuleer_busbericht:
  name: Busbericht simuleren
  description: Verwerk een busbericht alsof het van de bus kwam. De CRC wordt er zelf bij berekend. Handig om opnames te testen.
  fields:
    hub:
      name: Installatie
      required: false
      selector:
        text:
    adres:
      name: Adres (hex)
      description: Bijvoorbeeld 40 (relais 0) of 00 (ingang 0).
      required: true
      selector:
        text:
    payload:
      name: Payload (hex)
      description: Bijvoorbeeld 01 05 voor een relaisstand met kanaal 0 en 2 aan.
      required: true
      selector:
        text:

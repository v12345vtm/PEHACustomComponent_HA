# knop_lamp_dimmen.yaml - Peha PHC blauwdruk, versie 0.1.2
# knop_lamp_dimmen.yaml - Peha PHC blauwdruk, versie 0.1.2 (Multi-knop)
blueprint:
  name: Peha knop - kort schakelen, lang dimmen (Meerdere knoppen)
  description: >-
    Kort indrukken van een Peha-ingangsknop schakelt de lamp om. Lang indrukken laat de
    helderheid veranderen zolang de knop ingedrukt blijft. Bij het loslaten stopt het dimmen.
    Werkt met elke light-entiteit in Home Assistant die helderheid ondersteunt, van welk merk ook.
    Gebruikt de sensor 'Event NN' van de ingangsknop.
  domain: automation
  input:
    knop:
      name: Knop(pen)
      description: De sensor(en) 'Event NN' van de ingangsknop(pen). Je kunt hier meerdere knoppen selecteren.
      selector:
        entity:
          domain: sensor
          integration: peha_phc
          multiple: true # <-- Hiermee kun je meerdere knoppen kiezen!
    lamp:
      name: Lamp of dimmer
      description: Elke light-entiteit met helderheid, van welk merk ook.
      selector:
        entity:
          domain: light
    looptijd:
      name: Looptijd van 0 naar 100 procent
      default: 5
      selector:
        number:
          min: 1
          max: 60
          step: 0.5
          unit_of_measurement: s
          mode: box
    richting:
      name: Richting bij lang indrukken
      default: automatisch
      selector:
        select:
          options:
            - automatisch
            - omhoog
            - omlaag
          mode: dropdown
    veiligheidstijd:
      name: Maximale dimtijd zonder loslaat-event
      default: 60
      selector:
        number:
          min: 5
          max: 300
          step: 5
          unit_of_measurement: s
          mode: box

variables:
  lamp_entity: !input lamp
  looptijd_s: !input looptijd
  richting_keuze: !input richting
  veiligheid_s: !input veiligheidstijd

mode: restart

triggers:
  - trigger: state
    entity_id: !input knop
    to: "3"
    id: kort
  - trigger: state
    entity_id: !input knop
    to: "4"
    id: lang

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: kort
        sequence:
          - action: light.toggle
            target:
              entity_id: !input lamp
      - conditions:
          - condition: trigger
            id: lang
        sequence:
          - variables:
              active_knop: "{{ trigger.entity_id }}" # Onthoud welke specifieke knop werd ingedrukt
              start: "{{ now().timestamp() }}"
              richting: "{% set b = state_attr(lamp_entity, 'brightness') | int(0) %}{% if richting_keuze == 'omhoog' %}omhoog{% elif richting_keuze == 'omlaag' %}omlaag{% elif b > 127 %}omlaag{% else %}omhoog{% endif %}"
          - repeat:
              while:
                - condition: template
                  value_template: "{% set b = state_attr(lamp_entity, 'brightness') | int(0) %}{% set modes = state_attr(lamp_entity, 'supported_color_modes') or [] %}{{ modes != ['onoff'] and not is_state(lamp_entity, 'unavailable') and states(active_knop) not in ['3', '5', '7'] and (now().timestamp() - (start | float(0))) < (veiligheid_s | float(60)) and not (richting == 'omlaag' and b <= 0) and not (richting == 'omhoog' and b >= 255) }}"
              sequence:
                - variables:
                    nieuw: "{% set b = state_attr(lamp_entity, 'brightness') | int(0) %}{% set stap = 255 * 0.3 / (looptijd_s | float(5)) %}{% set doel = b + stap if richting == 'omhoog' else b - stap %}{{ [[doel, 0] | max, 255] | min | round(0) | int }}"
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ nieuw | int(0) > 0 }}"
                      sequence:
                        - action: light.turn_on
                          target:
                            entity_id: !input lamp
                          data:
                            brightness: "{{ nieuw | int(1) }}"
                  default:
                    - action: light.turn_off
                      target:
                        entity_id: !input lamp
                - delay:
                    milliseconds: 300
